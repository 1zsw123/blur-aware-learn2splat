name: default

do_densify: true
do_prune: true
do_opacity_reset: true

#
cap_max: -1  # no cap

# scheduling
pause_refine_after_reset: 0
refine_every: 100
reset_every: 3000
refine_start_iter: 500
refine_stop_iter: 15000
refine_scale2d_stop_iter: 0

# thresholds
grow_grad2d: 0.0002
grow_scale3d: 0.01  # aka. percent_dense
prune_scale3d: 0.1
prune_scale2d: 0.15
grow_scale2d: 0.05
min_opacity: 0.005

# Pruning parameters
prune_zero_radii: false

# Slightly reduce opacity every few steps
reduce_opacity: false
reduce_factor: 0.0  # not used
reduce_every: 0  # not used

fallback_means_lr: 0.0  # unused (noise_lr=0.0)