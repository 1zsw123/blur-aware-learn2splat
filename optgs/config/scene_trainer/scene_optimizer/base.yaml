defaults:
  - refiner: none
  - lr_scheduler: none

# gradinents
input_gradients_chunk_size: -1

# iterative refine
no_refine_mean: false
no_refine_scale: false
no_refine_rotation: false
no_refine_opacity: false
no_refine_sh0: false
no_refine_shN: false

zero_state_on_densify: false

# L1 opacity regularization from 3DGS-MCMC (arXiv:2404.09591); set > 0 (e.g. 1e-3) to enable
opacity_reg_lambda: 0.0