defaults:
  - base
  - override refiner: default

name: adam

# Adam optimizer
betas: [0.99, 0.999]
eps: 1e-15
weight_decay: 0.0

base_lr: 5
# 3dgs defaults
means_lr_init: 1.6e-4  # Setting same as final to have constant LR
means_lr_final: 1.6e-4
means_lr_delay_mult: 0.0
means_lr_max_steps: 30000  # should be equal to total optimization steps
scales_lr: 5e-3
rotations_lr: 1e-3
opacities_lr: 5e-2
sh0s_lr: 2.5e-3
shNs_lr: 1.25e-4